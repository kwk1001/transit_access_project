project:
  city_id: boston
  city_label: Boston
  survey_name: Massachusetts Travel Survey
  survey_wave: 2011
  timezone: America/New_York

survey:
  source_id: boston_mts2011
  adapter: massachusetts_2011
  zip_path: data/raw/surveys/boston/HH.zip
  keep_complete_only: true

analysis_area:
  tract_year: 2020
  county_outline_year: 2023
  counties:
    - state: MA
      county: Suffolk
    - state: MA
      county: Middlesex
    - state: MA
      county: Norfolk
    - state: MA
      county: Essex
    - state: MA
      county: Plymouth
    - state: MA
      county: Bristol
    - state: MA
      county: Worcester

spatial:
  analysis_unit: zip
  unit_label: ZIP code
  zcta_year: 2020
  zcta_id_field: null
  zip_assignment_method: tract_centroid
  taz:
    zones_file: null
    zone_id_col: zone_id
    zone_label_col: zone_label
    assign_from: raw_zone
    raw_trip_origin_col: origin_taz_raw
    raw_trip_destination_col: destination_taz_raw
  custom:
    zones_file: null
    zone_id_col: zone_id
    zone_label_col: zone_label
    assign_from: tract_centroid
    raw_trip_origin_col: null
    raw_trip_destination_col: null

osm:
  download_url: https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf
  local_pbf_path: data/raw/osm/boston/massachusetts-latest.osm.pbf

study_periods:
  - period_id: P1
    period_label: 2025-08-04_to_2025-08-25
    period_start: 2025-08-04
    period_end_exclusive: 2025-08-25
  - period_id: P2
    period_label: 2025-08-25_to_2025-09-08
    period_start: 2025-08-25
    period_end_exclusive: 2025-09-08
  - period_id: P3
    period_label: 2025-09-08_to_2025-09-29
    period_start: 2025-09-08
    period_end_exclusive: 2025-09-29

analysis_calendar:
  weekday_only: true
  excluded_dates:
    - 2025-09-01

od_scenarios:
  - scenario_id: peak
    scenario_label: Peak, all purposes
    weekday_only: true
    allowed_travel_dow: []
    transit_only: false
    allowed_purpose_groups: []
    allowed_mode_groups: []
    exclude_same_zone: true
    time_bin_rules:
      - time_bin: peak
        start_time: 07:30:00
        end_time: 09:30:00
  - scenario_id: midday
    scenario_label: Midday, all purposes
    weekday_only: true
    allowed_travel_dow: []
    transit_only: false
    allowed_purpose_groups: []
    allowed_mode_groups: []
    exclude_same_zone: true
    time_bin_rules:
      - time_bin: midday
        start_time: 11:00:00
        end_time: 14:00:00

auxiliary_weights:
  origin_multiplier_file: null
  origin_id_col: GEOID
  origin_multiplier_col: multiplier
  destination_multiplier_file: null
  destination_id_col: GEOID
  destination_multiplier_col: multiplier

r5r_network:
  java_memory: 16G
  overwrite_networks: true
  java_active_processors: 6

routing:
  modes:
    - WALK
    - TRANSIT
  max_walk_time: 30
  walk_speed: 4.68
  max_trip_duration: 180
  max_rides: 4
  max_lts: 2
  percentiles:
    - 50
  service_area_buffer_m: 2000
  restrict_to_service_area: true
  origin_chunk_size: 50
  date_strategy: sample_n_dates_per_period
  sample_n_dates_per_period: 3
  n_threads: 6
  unreachable_penalty_minutes: 180
  routing_windows:
    - time_window_id: peak
      time_window_label: Peak
      od_scenario_id: peak
      start_time: 07:30:00
      end_time: 09:30:00
    - time_window_id: midday
      time_window_label: Midday
      od_scenario_id: midday
      start_time: 11:00:00
      end_time: 14:00:00

map:
  default_comparison_id: P3_vs_P1
  default_time_window_id: peak
  od_top_pairs_max: 500
  od_top_pairs_default: 100
  comparison_metrics:
    - delta_avg_weighted_travel_time_penalized
    - delta_pct_weighted_travel_time_penalized
    - delta_unreachable_share_weighted
    - share_weight_increase_gt_10
    - share_weight_becomes_unreachable
  period_metrics:
    - avg_weighted_travel_time_penalized
    - share_unreachable_weighted
    - share_accessible_45min_weighted

gtfs_feeds:
  - feed_name: MBTA_Merged
    valid_start: 2025-08-04
    valid_end_exclusive: 2025-09-28
    gtfs_files:
      - data/raw/gtfs/boston/MBTA-Merged-0805-0928.zip

optional_covariates:
  download_population: false

run_management:
  run_label: null
  cleanup_failed_runs: true
